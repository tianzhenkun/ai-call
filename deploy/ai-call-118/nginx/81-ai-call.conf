# 放入 81.68.166.109 的 Nginx http {} 中；保留现有 /voice-api/ 配置不变。
map $http_upgrade $ai_call_connection_upgrade {
  default upgrade;
  '' close;
}

upstream ai_call_agent_api {
  server 10.77.0.2:19011;
  keepalive 16;
}

# 加到现有 recov.lingchen-ai.com 的 443 server {} 内。
location /ai-call-agent-api/ {
  proxy_pass http://ai_call_agent_api/;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Authorization $http_authorization;
  proxy_buffering off;
  proxy_request_buffering off;
  proxy_read_timeout 3600s;
  proxy_send_timeout 3600s;
}

# 加到同一 443 server {} 内，复用标准 HTTPS 端口，避免额外公网 TLS 端口。
location ^~ /livekit/ {
  proxy_pass http://10.77.0.2:7880/;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $ai_call_connection_upgrade;
  proxy_read_timeout 3600s;
  proxy_send_timeout 3600s;
  proxy_buffering off;
  proxy_cache off;
}
