# 放入 81.68.166.109 的 Nginx http {} 中；保留现有 /voice-api/ 配置不变。
map $http_upgrade $ai_call_connection_upgrade {
  default upgrade;
  '' close;
}

upstream ai_call_agent_api {
  server 10.77.0.2:19011;
  keepalive 16;
}

# 加到现有 recov.lingchen-ai.com 的 443 server {} 内。
location /ai-call-agent-api/ {
  proxy_pass http://ai_call_agent_api/;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Authorization $http_authorization;
  proxy_buffering off;
  proxy_request_buffering off;
  proxy_read_timeout 3600s;
  proxy_send_timeout 3600s;
}

# 使用现有 recov.lingchen-ai.com 证书新增一个 TLS 端口；不新增域名。
server {
  listen 7880 ssl;
  server_name recov.lingchen-ai.com;

  # 复用现有 443 server 的 ssl_certificate / ssl_certificate_key 配置。
  ssl_certificate     /REPLACE/WITH/existing/fullchain.pem;
  ssl_certificate_key /REPLACE/WITH/existing/privkey.pem;

  location / {
    proxy_pass http://10.77.0.2:7880;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $ai_call_connection_upgrade;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }
}
