<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Phase A Web 验证台</title>
    <link rel="icon" href="/static/image/favicon.png" />
    <script src="/static/vendor/livekit-client.umd.min.js"></script>
    <link rel="stylesheet" href="/static/ai-call/phase-a.css" />

  </head>
  <body>
    <main class="shell">
      <section class="topbar">
        <div class="brand">
          <img src="/static/image/logo.png" alt="" />
          <div>
            <h1>Phase A Web 验证台</h1>
            <p class="subtle">LiveKit Room + Qwen Realtime 核心链路手工验收入口</p>
          </div>
        </div>
        <div id="status-pill" class="status-pill">未创建</div>
      </section>

      <section class="layout">
        <aside class="panel">
          <div class="panel-header">
            <h2>会话控制</h2>
          </div>
          <div class="panel-body form-grid">
            <label>
              音色
              <select id="voice-select">
                <option value="Tina">Tina</option>
                <option value="Cherry">Cherry</option>
                <option value="Serena">Serena</option>
                <option value="Ethan">Ethan</option>
              </select>
            </label>
            <label>
              Prompt
              <input id="prompt-input" maxlength="500" placeholder="留空使用服务端默认话术" />
            </label>
            <div class="button-row">
              <button id="create-session" class="primary" type="button">创建会话</button>
              <button id="connect-room" type="button" disabled>连接麦克风</button>
            </div>
            <div class="button-row single">
              <button id="end-session" class="danger" type="button" disabled>结束会话</button>
            </div>

            <div class="facts">
              <div class="fact">
                <span>call_id</span>
                <span id="call-id" class="mono">-</span>
              </div>
              <div class="fact">
                <span>Room</span>
                <span id="room-name" class="mono">-</span>
              </div>
              <div class="fact">
                <span>模型</span>
                <span id="model-name" class="mono">-</span>
              </div>
              <div class="fact">
                <span>开场白</span>
                <span id="opening-state">-</span>
              </div>
              <div class="fact">
                <span>麦克风</span>
                <span id="mic-state">未连接</span>
              </div>
            </div>
          </div>
        </aside>

        <section class="main-stack">
          <section class="panel">
            <div class="panel-header">
              <h2>延迟指标</h2>
              <button id="refresh-status" type="button" disabled>刷新</button>
            </div>
            <div class="panel-body">
              <div class="metric-grid">
                <div class="metric">
                  <div class="label">最近模型首包</div>
                  <div id="metric-model-first" class="value">-</div>
                </div>
                <div class="metric">
                  <div class="label">最近浏览器首包</div>
                  <div id="metric-browser-first" class="value">-</div>
                </div>
                <div class="metric">
                  <div class="label">打断停播</div>
                  <div id="metric-interrupt" class="value">-</div>
                </div>
                <div class="metric">
                  <div class="label">音频队列</div>
                  <div id="metric-queue" class="value">-</div>
                </div>
              </div>
            </div>
          </section>

          <section class="panel">
            <div class="panel-header">
              <h2>浏览器音频约束</h2>
            </div>
            <div class="panel-body">
              <div id="constraints" class="constraints">
                <span class="constraint">等待创建会话</span>
              </div>
            </div>
          </section>

          <section class="panel">
            <div class="panel-header">
              <h2>事件列表</h2>
              <button id="refresh-events" type="button" disabled>刷新事件</button>
            </div>
            <div class="panel-body">
              <div id="event-list" class="event-list">
                <div class="subtle">暂无事件</div>
              </div>
            </div>
          </section>

          <section class="panel">
            <div class="panel-header">
              <h2>运行日志</h2>
            </div>
            <div class="panel-body">
              <div id="log" class="log"></div>
            </div>
          </section>
        </section>
      </section>
    </main>

    <script src="/static/ai-call/phase-a.js"></script>

  </body>
</html>
